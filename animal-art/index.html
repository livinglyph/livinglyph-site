            loading="lazy"
            data-parallax
            data-speed="-0.018"
          />
        </article>

        <article class="gallery-piece piece-right reveal">
          <img
            src="../assets/images/bengal-tiger.png"
            alt="BENGAL TIGER animal artwork"
            loading="lazy"
            data-parallax
            data-speed="0.016"
          />

        <article class="gallery-piece piece-left reveal">
          <img
            src="../assets/images/uroboros.png"
            alt="UROBOROS animal artwork"
            loading="lazy"
            data-parallax
            data-speed="-0.015"
          />

        <article class="gallery-piece piece-right reveal">
          <img
            src="../assets/images/coming-soon.png"
            alt="COMING SOON animal artwork"

            data-parallax
            data-speed="0.014"
