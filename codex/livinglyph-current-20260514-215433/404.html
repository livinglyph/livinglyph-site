<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 | LIVINGLYPH</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
      }

      .not-found {
        display: grid;
        gap: 1.6rem;
        width: min(100% - 2rem, 34rem);
        text-align: center;
      }

      .not-found h1 {
        margin: 0;
        font-family: var(--latin-serif);
        font-size: clamp(2rem, 8vw, 4.8rem);
        font-weight: 400;
        letter-spacing: 0.08em;
      }

      .not-found p {
        margin: 0;
        color: rgba(246, 243, 238, 0.68);
        font-family: var(--serif);
        line-height: 1.9;
      }

      .not-found a {
        justify-self: center;
        color: rgba(246, 243, 238, 0.86);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <h1>404</h1>
      <p>この場所には、まだ文字が宿っていません。</p>
      <a href="/">LIVINGLYPHへ戻る</a>
    </main>
  </body>
</html>
